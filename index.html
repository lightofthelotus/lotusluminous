<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Shelf — Lotus Luminous</title>
<meta name="description" content="A digital bookshelf of novels, short stories, and technology articles by Lotus Luminous." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/bookshelf.css" />
</head>
<body>

<header class="site-header">
  <div class="site-header-row">
    <a href="../index.html" class="site-title">The Lotus <span>Luminous</span></a>
    <button class="info-toggle" id="infoToggle" aria-label="About this site" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="7.5" x2="12" y2="7.5"/></svg>
    </button>
  </div>
  <h2 class="shelf-heading">Browse My Collection</h2>
</header>

<div class="stage">
  <div class="shelf-pane">
    <main class="library" id="library" aria-live="polite">
      <!-- Shelves are rendered here by js/bookshelf.js -->
    </main>
  </div>

  <aside class="detail-panel" id="detailPanel">
    <button class="detail-close" id="detailClose" aria-label="Close">&times;</button>
    <div class="detail-inner" id="detailInner">
      <div class="detail-placeholder" id="detailPlaceholder">
        <h2 class="detail-title">Hi, I'm Lotus Luminous</h2>
        <p class="detail-description">This is my personal site where I write about the software I build and the fiction I make up — Browse the bookshelf which contains my original thoughts and words !!</p>
      </div>
      <div class="detail-content" id="detailContent" hidden>
        <p class="detail-tag" id="detailTag"></p>
        <h2 class="detail-title" id="detailTitle"></h2>
        <p class="detail-meta" id="detailMeta"></p>
        <p class="detail-description" id="detailDescription"></p>
        <a class="detail-link" id="detailLink" href="#">Read →</a>
      </div>
    </div>
  </aside>
</div>

<div class="detail-overlay" id="detailOverlay"></div>

<p class="site-footer">&copy; <span id="year"></span> Lotus Luminous.</p>

<script src="js/bookshelf.js"></script>
</body>
</html>
