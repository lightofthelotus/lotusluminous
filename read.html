<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Loading… — Lotus Luminous</title>
<meta name="description" content="" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=Inter:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/bookshelf.css" />
<link rel="stylesheet" href="css/read.css" />
</head>
<body class="reader-page" id="readerBody">

<nav class="float-nav float-nav--left" id="floatNavLeft">
  <a href="index.html" class="float-btn" title="Home" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
  </a>
  <a href="index.html" class="float-btn" id="backLink" title="Back" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  </a>
</nav>

<nav class="float-nav float-nav--right" id="floatNavRight">
  <select class="chapter-select" id="chapterSelect" aria-label="Jump to chapter" hidden></select>

  <div class="page-jump" id="pageJump" hidden>
    <input type="number" class="page-jump-input" id="pageJumpInput" min="1" value="1" aria-label="Jump to page" />
    <span class="page-jump-total" id="pageJumpTotal">/ 1</span>
  </div>

  <div class="bookmark-tab" id="bookmarkTab">
    <button type="button" class="float-btn" id="bookmarkToggle" aria-label="Bookmarks" aria-expanded="false" title="Bookmarks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
      <span class="bookmark-count" id="bookmarkCount" hidden>0</span>
    </button>

    <div class="bookmark-panel" id="bookmarkPanel" hidden>
      <div class="bookmark-panel-head">
        <span>Bookmarks</span>
        <button type="button" class="bookmark-add" id="bookmarkAdd">+ Add this page</button>
      </div>
      <ul class="bookmark-list" id="bookmarkList"></ul>
      <p class="bookmark-empty" id="bookmarkEmpty">No bookmarks yet — up to 5 per book.</p>
    </div>
  </div>
</nav>

<main class="reader-viewport" id="readerViewport">
  <div class="reader-fixed-header" id="readerHeader">
    <div class="skeleton-row" style="grid-template-columns: 1fr;">
      <div class="skeleton-card" style="height: 14vh;"></div>
    </div>
  </div>

  <div class="pager" id="pager">
    <div class="pager-viewport" id="pagerViewport">
      <div class="pager-track" id="pagerTrack"></div>
    </div>
    <div class="reader-body" id="pagerSource" hidden></div>
  </div>
</main>

<script src="js/common.js"></script>
<script src="js/markdown.js"></script>
<script src="js/paginate.js"></script>
<script src="js/read.js"></script>
</body>
</html>
